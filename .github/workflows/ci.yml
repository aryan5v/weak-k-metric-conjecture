name: research-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and exact tests
        run: pytest -q
      - name: Bounded construction verification sweep
        run: python scripts/sweep_verify.py
